name: oct
description: "OCT - Offline Chess Training. Treino de xadrez 100% offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  sqflite: ^2.4.3
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  http: ^1.6.0
  archive: ^3.6.1
  chess: ^0.8.1
  stockfish_chess_engine: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/puzzles_free.json
    - assets/data/puzzles_premium_demo.zip
    - assets/engine/
